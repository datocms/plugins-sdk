name: CI

# The checks of the mirror: the install from the lockfile, the build, the
# tests, the types and the lint. They run on each push to the branch and on
# each pull request to it, also from a fork.

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Type check
        run: npm run tsc

      - name: Lint and format check
        run: npm run lint && npx biome ci .
